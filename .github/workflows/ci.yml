name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check colocated tests for changed frontend sources
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci/check-frontend-test-colocation.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm test
        env:
          CI: true

  backend:
    name: Backend (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
        env:
          CI: true

  e2e:
    name: E2E (Playwright + Postgres)
    runs-on: ubuntu-latest
    env:
      CI: true
      CI_DB_USER: ${{ vars.CI_DB_USER || 'lti_ci_user' }}
      CI_DB_NAME: ${{ vars.CI_DB_NAME || 'lti_ci_db' }}
      CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || format('ci_{0}_{1}', github.run_id, github.run_attempt) }}
      DATABASE_URL: postgresql://${{ vars.CI_DB_USER || 'lti_ci_user' }}:${{ secrets.CI_DB_PASSWORD || format('ci_{0}_{1}', github.run_id, github.run_attempt) }}@localhost:5432/${{ vars.CI_DB_NAME || 'lti_ci_db' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ vars.CI_DB_USER || 'lti_ci_user' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || format('ci_{0}_{1}', github.run_id, github.run_attempt) }}
          POSTGRES_DB: ${{ vars.CI_DB_NAME || 'lti_ci_db' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ vars.CI_DB_USER || 'lti_ci_user' }} -d ${{ vars.CI_DB_NAME || 'lti_ci_db' }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend — install
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Backend — Prisma migrate & seed
        working-directory: backend
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed

      - name: Frontend — install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Playwright — Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright — test
        working-directory: frontend
        run: pnpm exec playwright test
